<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E6EDEF">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<title>AB POS</title>
<style>
:root{--bg:#F0F1F2;--card:#E6EDEF;--band:#D3EAF0;--btn:#CFEAF1;--field:#fff;--ink:#111;--mute:#7D888D;--line:#fff;--sep:#E6EDEF;--err:#B04A3A;--on:#2FA36B;--offc:#D0463A}
:root[data-theme=dark]{--bg:#0B1216;--card:#16212A;--band:#143036;--btn:#1E4A52;--field:#0F1A21;--ink:#EAF2F4;--mute:#8FA3AA;--line:#2A3B45;--sep:#1C2A33;--err:#FF9C8A}
*{box-sizing:border-box}html{background:var(--bg)}
body{margin:0;font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:var(--bg);padding:max(10px,env(safe-area-inset-top)) 10px 14px}
button{font-family:inherit;color:inherit;cursor:pointer}
.win{max-width:560px;margin:0 auto;background:var(--card);border:2px solid var(--line);border-radius:32px}
.top{display:flex;justify-content:space-between;align-items:flex-start;padding:16px 16px 6px}
.tl{display:flex;align-items:flex-start;gap:10px}
.ic{width:42px;height:42px;border:0;border-radius:50%;background:var(--field);font-size:18px;display:flex;align-items:center;justify-content:center}
.brand{display:flex;flex-direction:column;gap:3px}
.lg{width:34px;height:34px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden}.lg img{width:28px;height:28px;object-fit:contain}
.nm{display:flex;align-items:center;gap:2px;font-size:12px;font-weight:600}
.dot{width:22px;height:22px;border:0;background:transparent;padding:0;display:flex;align-items:center;justify-content:center}.dot::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--on)}.dot.off::before{background:var(--offc)}
#connTxt{font-size:11px;font-weight:400;color:var(--mute)}
.bd{padding:6px 16px 8px}
.fld{width:100%;height:50px;border:2px solid var(--line);background:var(--field);color:var(--ink);border-radius:16px;padding:0 14px;font-size:16px;outline:none}
.box{background:var(--field);border-radius:18px;padding:6px 14px;margin-top:8px}
.bh{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--mute);padding:6px 0 2px;letter-spacing:.4px}
.lnk{border:0;background:transparent;color:var(--mute);font-size:11px;font-weight:700;padding:6px}
#results{max-height:210px;overflow:auto}
.rr{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--sep);font-size:14px}.rr:last-child{border:0}.rr:active{opacity:.6}.rr span{overflow-wrap:anywhere}.rr b{white-space:nowrap}
.empty{text-align:center;color:var(--mute);font-size:13px;padding:14px 0}
.ci{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--sep)}.ci .n{flex:1;min-width:0}.ci .n b{display:block;font-size:13px;overflow-wrap:anywhere}.ci .n small{color:var(--mute);font-size:12px}
.q{width:28px;height:28px;border:0;border-radius:50%;background:var(--card);font-size:17px;line-height:1;padding:0}.qn{min-width:18px;text-align:center;font-size:14px;font-weight:700}.lt{min-width:62px;text-align:right;font-size:13px;font-weight:700}
.tot{display:flex;justify-content:space-between;align-items:baseline;padding:10px 0 6px;font-size:15px}.tot b{font-size:20px}
.lbl{font-size:11px;color:var(--mute);margin:14px 0 6px 4px}
.meth{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.meth button{border:2px solid transparent;background:var(--field);border-radius:22px;padding:11px 0;font-size:14px}.meth button[aria-pressed=true]{background:var(--btn);border-color:var(--line);font-weight:700}
.prow{display:flex;align-items:center;gap:8px;margin-top:8px}.prow span{width:64px;font-size:13px;color:var(--mute);padding-left:4px}.prow input{flex:1}
.prow input,.bid{height:46px;border:2px solid var(--line);background:var(--field);color:var(--ink);border-radius:14px;padding:0 12px;font-size:16px;outline:none;min-width:0}
.bid{width:100%;margin-top:8px}
.rem{text-align:right;margin:10px 4px 0;font-size:13px;color:var(--mute)}.rem b{color:var(--ink);font-size:15px}.rem.bad b{color:var(--err)}
.band{position:sticky;bottom:0;background:var(--band);padding:12px 16px 16px;border-radius:0 0 30px 30px}
#payMsg{font-size:12px;color:var(--err);min-height:16px;margin:0 4px 8px;line-height:1.4}
.pillbtn{width:100%;border:2px solid var(--line);background:var(--btn);border-radius:30px;padding:15px;font-size:16px;font-weight:700}
#backdrop{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:25}
.side{position:fixed;top:0;bottom:0;left:0;width:min(80vw,300px);background:var(--card);border-right:2px solid var(--line);border-radius:0 28px 28px 0;transform:translateX(-105%);transition:transform .2s;z-index:30;padding:max(20px,env(safe-area-inset-top)) 14px 20px}.side.open{transform:none}
.side h2{font-size:11px;letter-spacing:.6px;color:var(--mute);margin:6px 8px 12px}
.mi{display:flex;justify-content:space-between;align-items:center;width:100%;border:0;background:var(--field);border-radius:16px;padding:14px;font-size:15px;margin-bottom:8px;text-align:left}.mi.on{background:var(--btn);font-weight:700}.mi:disabled{opacity:.55}.mi small{font-size:11px;color:var(--mute)}
.pop{position:fixed;top:calc(max(10px,env(safe-area-inset-top)) + 62px);right:16px;width:250px;background:var(--card);border:2px solid var(--line);border-radius:22px;padding:12px;z-index:30}
.sg{background:var(--field);border-radius:14px;padding:10px 12px;margin-bottom:8px}.sg small{display:block;font-size:11px;color:var(--mute)}.sg.row{display:flex;justify-content:space-between;align-items:center;font-size:14px}
.sw{width:44px;height:26px;border-radius:13px;border:2px solid var(--line);background:var(--card);padding:0;position:relative}.sw i{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:var(--mute);transition:left .15s}.sw[aria-checked=true]{background:var(--btn)}.sw[aria-checked=true] i{left:20px;background:var(--ink)}
.pop .pillbtn{padding:11px;font-size:14px}
dialog{border:2px solid var(--line);border-radius:28px;padding:0;background:var(--card);color:var(--ink);width:min(90vw,380px)}dialog::backdrop{background:rgba(0,0,0,.5)}
.modal{padding:20px}.modal h2{font-size:12px;letter-spacing:.5px;color:var(--mute);margin:0 0 10px}.modal p{font-size:15px;line-height:1.5;margin:0 0 16px;white-space:pre-line}
.login{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:18px;background:var(--bg);overflow:auto;z-index:40}
body.auth .login{display:flex}body.auth .win,body.auth #backdrop,body.auth .side,body.auth .pop{display:none!important}
.lcard{width:100%;max-width:380px;background:var(--card);border:2px solid var(--line);border-radius:36px;overflow:hidden}
.ltop{padding:20px 22px 4px}.lrow{display:flex;justify-content:space-between;align-items:flex-start}
.llogo{width:58px;height:58px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden}.llogo img{width:50px;height:50px;object-fit:contain}
.lhead{text-align:right;margin-top:10px}.lhead b{display:block;font-size:20px;font-weight:600}.lhead small{display:block;font-size:12px;color:var(--mute);margin-top:2px}
.lf{margin-top:16px}.lf label{display:block;font-size:11px;color:var(--mute);margin:0 0 5px 4px}
#lgMsg{font-size:12px;color:var(--err);min-height:34px;margin:10px 4px 0;line-height:1.4}
.lband{background:var(--band);padding:16px 22px 22px}.lband button{width:100%;border-radius:30px;font-size:16px;border:2px solid var(--line)}
#lgBtn{background:var(--btn);padding:15px;font-weight:700}#lgForgot{background:var(--field);padding:13px;font-weight:500;margin-top:10px;font-size:14px}
.pw{position:relative}.pw .fld{padding-right:54px}
.eye{position:absolute;right:6px;top:6px;width:38px;height:38px;border:0;background:transparent;font-size:18px;border-radius:50%;padding:0}
.err{font-size:12px;color:var(--err);min-height:18px;margin:8px 4px 10px;line-height:1.4}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:24px;letter-spacing:2px;text-align:center;background:var(--field);border-radius:16px;padding:16px 8px;margin:6px 0 14px;user-select:all;-webkit-user-select:all}
.acts2{display:flex;gap:8px;margin-top:6px}.acts2 .pillbtn{padding:13px;font-size:14px}.alt{background:var(--field)!important}
dialog .lf:first-of-type{margin-top:4px}
</style>
</head>
<body class="auth">

<div class="login" id="loginView"><div class="lcard">
 <div class="ltop">
  <div class="lrow"><button class="ic themeBtn" type="button" aria-label="Switch light and dark mode">☾</button><div class="llogo"><img src="icon-192.png" alt="Pharmacy logo"></div></div>
  <div class="lhead"><b>Aisha Bakhit Pharmacy</b><small>mahmoud abu eyad</small></div>
  <div class="lf"><label for="lgUser">Username</label><input class="fld" id="lgUser" type="text" autocomplete="username" autocapitalize="none" spellcheck="false"></div>
  <div class="lf"><label for="lgPass">Password</label><div class="pw"><input class="fld" id="lgPass" type="password" autocomplete="current-password" autocapitalize="none" spellcheck="false"><button class="eye" id="lgEye" type="button" aria-label="Show password">👁</button></div></div>
  <p id="lgMsg" role="alert"></p>
 </div>
 <div class="lband"><button id="lgBtn" type="button">Sign in</button><button id="lgForgot" type="button">Forgot password?</button></div>
</div></div>

<div class="win" id="app">
 <div class="top">
  <div class="tl">
   <button class="ic" id="menuBtn" type="button" aria-label="Menu">☰</button>
   <div class="brand"><span class="lg"><img src="icon-192.png" alt="Pharmacy logo"></span>
    <span class="nm">Aisha Bakhit Pharmacy<button class="dot" id="dot" type="button" aria-label="Connection status"></button><small id="connTxt"></small></span></div>
  </div>
  <button class="ic" id="setBtn" type="button" aria-label="Settings">⚙</button>
 </div>
 <div class="bd">
  <input class="fld" id="q" type="search" placeholder="Search products…" autocomplete="off">
  <div class="box" id="results" hidden></div>
  <div class="box"><div class="bh"><span id="cartTitle">CART</span><button class="lnk" id="clear" type="button">CLEAR</button></div><div id="cart"></div><div class="tot"><span>Total</span><b id="total">0</b></div></div>
  <div class="lbl">PAYMENT METHOD</div>
  <div class="meth"><button type="button" data-m="CASH" aria-pressed="false">Cash</button><button type="button" data-m="BANKAK" aria-pressed="false">Bankak</button><button type="button" data-m="O-CASH" aria-pressed="false">O-Cash</button></div>
  <div id="payRows"></div>
  <div class="rem" id="remBox">Remaining: <b id="rem">0</b></div>
 </div>
 <div class="band"><p id="payMsg" role="alert"></p><button class="pillbtn" id="pay" type="button">Pay</button></div>
</div>

<div id="backdrop" hidden></div>
<aside class="side" id="menuPanel" aria-label="Menu"><h2>MENU</h2>
 <button class="mi on" id="miSale" type="button">New sale</button>
 <button class="mi" type="button" disabled>Shift report<small>Soon</small></button>
 <button class="mi" type="button" disabled>Reports<small>Soon</small></button>
 <button class="mi" type="button" disabled>Inventory<small>Soon</small></button>
 <button class="mi" type="button" disabled>Users<small>Soon</small></button>
</aside>
<div class="pop" id="setPanel" hidden>
 <div class="sg"><small>Signed in as</small><b id="who"></b></div>
 <div class="sg row"><span>Dark mode</span><button class="sw" id="darkSw" type="button" role="switch" aria-checked="false" aria-label="Dark mode"><i></i></button></div>
 <button class="pillbtn alt" id="recBtn" type="button" style="margin-bottom:8px">Recovery code</button>
 <button class="pillbtn" id="signOut" type="button">Sign out</button>
</div>
<dialog id="resetDialog"><div class="modal"><h2>RESET PASSWORD</h2>
 <div class="lf"><label for="rsUser">Username</label><input class="fld" id="rsUser" type="text" autocapitalize="none" spellcheck="false"></div>
 <div class="lf"><label for="rsCode">Recovery code</label><input class="fld" id="rsCode" type="text" autocapitalize="characters" spellcheck="false" placeholder="XXXX-XXXX-XXXX"></div>
 <div class="lf"><label for="rsPass">New password</label><div class="pw"><input class="fld" id="rsPass" type="password" autocapitalize="none" spellcheck="false"><button class="eye" id="rsEye" type="button" aria-label="Show password">👁</button></div></div>
 <p class="err" id="rsMsg" role="alert"></p>
 <div class="acts2"><button class="pillbtn alt" id="rsCancel" type="button">Cancel</button><button class="pillbtn" id="rsOk" type="button">Reset</button></div>
</div></dialog>
<dialog id="codeDialog"><div class="modal"><h2 id="codeTitle">RECOVERY CODE</h2>
 <div class="code" id="codeText"></div>
 <p>Write it down or take a screenshot now. It is shown only once, and it is the only way to reset the owner password without losing data.</p>
 <div class="acts2"><button class="pillbtn alt" id="codeCopy" type="button">Copy</button><button class="pillbtn" id="codeOk" type="button">I saved it</button></div>
</div></dialog>
<dialog id="noticeDialog"><div class="modal"><h2 id="noticeTitle"></h2><p id="noticeText"></p><button class="pillbtn" id="noticeOk" type="button">OK</button></div></dialog>

<script>
const $=id=>document.getElementById(id);
const money=v=>Number(v||0).toLocaleString('en-US');
function notice(t,x){$('noticeTitle').textContent=t;$('noticeText').textContent=x;$('noticeDialog').showModal()}
$('noticeOk').onclick=()=>$('noticeDialog').close();
// ---- Theme ----
function setTheme(t){document.documentElement.dataset.theme=t;document.querySelectorAll('.themeBtn').forEach(b=>b.textContent=t==='dark'?'☀':'☾');$('darkSw').setAttribute('aria-checked',String(t==='dark'));try{localStorage.setItem('ab_theme',t)}catch(e){}}
let saved='light';try{saved=localStorage.getItem('ab_theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')}catch(e){}
const flip=()=>setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');
setTheme(saved);document.querySelectorAll('.themeBtn').forEach(b=>b.onclick=flip);$('darkSw').onclick=flip;
// ---- Connection dot ----
let dotTimer;
function net(){const o=navigator.onLine;$('dot').classList.toggle('off',!o);$('dot').setAttribute('aria-label',o?'Online':'Offline')}
$('dot').onclick=()=>{$('connTxt').textContent=navigator.onLine?'Online':'Offline';clearTimeout(dotTimer);dotTimer=setTimeout(()=>$('connTxt').textContent='',2500)};
addEventListener('online',net);addEventListener('offline',net);net();
// ---- Database ----
function openDB(){return new Promise((res,rej)=>{
 const r=indexedDB.open('ab_pos',3);
 r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains('products'))d.createObjectStore('products',{keyPath:'id'});if(!d.objectStoreNames.contains('meta'))d.createObjectStore('meta',{keyPath:'key'});if(!d.objectStoreNames.contains('sales'))d.createObjectStore('sales',{keyPath:'invoice'});if(!d.objectStoreNames.contains('users'))d.createObjectStore('users',{keyPath:'username'})};
 r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
const req=r=>new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
async function seedIfNeeded(db){
 if(await req(db.transaction('meta').objectStore('meta').get('seeded')))return;
 const list=await (await fetch('products.json')).json();
 await new Promise((res,rej)=>{const tx=db.transaction(['products','meta'],'readwrite');
  list.forEach(p=>tx.objectStore('products').put(p));tx.objectStore('meta').put({key:'seeded',value:true});
  tx.oncomplete=res;tx.onerror=()=>rej(tx.error)});
}
let DB=null,products=[],sales=[],invoiceNo=1,users=[],currentUser=null,authReady=false,saving=false;
// ---- Search ----
const norm=s=>String(s||'').normalize('NFKC').toLowerCase().replace(/[\u064B-\u065F\u0670\u0640]/g,'').replace(/[أإآٱ]/g,'ا').replace(/ى/g,'ي').replace(/\s+/g,' ').trim();
function renderResults(){
 const box=$('results'),t=norm($('q').value);box.innerHTML='';
 if(!t){box.hidden=true;return}
 box.hidden=false;
 const m=products.filter(p=>p._n.includes(t)).slice(0,50);
 if(!m.length){box.innerHTML='<div class="empty">No matching products.</div>';return}
 m.forEach(p=>{const r=document.createElement('div');r.className='rr';
  const n=document.createElement('span');n.textContent=p.name;const pr=document.createElement('b');pr.textContent=money(p.price);
  r.append(n,pr);r.onclick=()=>addToCart(p);box.appendChild(r)});
}
$('q').addEventListener('input',renderResults);
// ---- Cart ----
const cart=new Map();
const cartTotal=()=>{let s=0;cart.forEach(l=>{s+=(Number(l.p.price)||0)*l.q});return s};
function addToCart(p){const l=cart.get(p.id);if(l)l.q++;else cart.set(p.id,{p,q:1});renderCart()}
function renderCart(){
 const box=$('cart');box.innerHTML='';let count=0;
 cart.forEach(l=>{count+=l.q});
 if(!cart.size)box.innerHTML='<div class="empty">Cart is empty. Tap a product to add it.</div>';
 cart.forEach((l,id)=>{
  const r=document.createElement('div');r.className='ci';
  const n=document.createElement('div');n.className='n';const b=document.createElement('b');b.textContent=l.p.name;const s=document.createElement('small');s.textContent=money(l.p.price);n.append(b,s);
  const m=document.createElement('button');m.className='q';m.type='button';m.textContent='−';m.setAttribute('aria-label','Decrease');m.onclick=()=>{l.q>1?l.q--:cart.delete(id);renderCart()};
  const c=document.createElement('span');c.className='qn';c.textContent=l.q;
  const a=document.createElement('button');a.className='q';a.type='button';a.textContent='+';a.setAttribute('aria-label','Increase');a.onclick=()=>{l.q++;renderCart()};
  const t=document.createElement('span');t.className='lt';t.textContent=money((Number(l.p.price)||0)*l.q);
  r.append(n,m,c,a,t);box.appendChild(r)});
 $('cartTitle').textContent='CART'+(count?' ('+count+')':'');$('total').textContent=money(cartTotal());
 $('pay').textContent=cart.size?'Pay '+money(cartTotal()):'Pay';
 refit();
}
$('clear').onclick=()=>{if(cart.size&&confirm('Clear the whole cart?')){cart.clear();renderCart()}};
// ---- Payment (split between Cash, Bankak, O-Cash) ----
const METHODS=['CASH','BANKAK','O-CASH'],LABEL={CASH:'Cash',BANKAK:'Bankak','O-CASH':'O-Cash'};
const pay={CASH:{on:false,amount:0},BANKAK:{on:false,amount:0},'O-CASH':{on:false,amount:0}};let bankakId='';
const sel=()=>METHODS.filter(m=>pay[m].on);
const paid=()=>sel().reduce((s,m)=>s+(Number(pay[m].amount)||0),0);
function updateRem(){const r=cartTotal()-paid();$('rem').textContent=money(Math.abs(r)<1e-6?0:r);$('remBox').classList.toggle('bad',r<-1e-6);$('payMsg').textContent=''}
function buildPayRows(){
 const box=$('payRows');box.innerHTML='';
 sel().forEach(m=>{
  const row=document.createElement('div');row.className='prow';
  const l=document.createElement('span');l.textContent=LABEL[m];
  const i=document.createElement('input');i.type='number';i.min='0';i.step='any';i.inputMode='decimal';i.placeholder='0';i.dataset.m=m;i.value=pay[m].amount?String(pay[m].amount):'';
  i.setAttribute('aria-label',LABEL[m]+' amount');
  i.oninput=()=>{pay[m].amount=Number(i.value)||0;
   const s=sel();if(s.length===2){const o=s.find(x=>x!==m);pay[o].amount=Math.max(0,cartTotal()-pay[m].amount);const oi=box.querySelector('input[data-m="'+o+'"]');if(oi)oi.value=pay[o].amount?String(pay[o].amount):''}
   updateRem()};
  row.append(l,i);box.appendChild(row);
  if(m==='BANKAK'){const b=document.createElement('input');b.className='bid';b.type='text';b.inputMode='numeric';b.maxLength=4;b.placeholder='4-digit Bankak ID (optional)';b.value=bankakId;b.setAttribute('aria-label','Bankak ID');
   b.oninput=()=>{b.value=b.value.replace(/\D/g,'').slice(0,4);bankakId=b.value;$('payMsg').textContent=''};box.appendChild(b)}
 });
 updateRem();
}
function refit(){const s=sel(),t=cartTotal();if(s.length===1)pay[s[0]].amount=t;else s.forEach((m,i)=>pay[m].amount=i?0:t);buildPayRows()}
document.querySelectorAll('.meth button').forEach(b=>b.onclick=()=>{
 const m=b.dataset.m,t=cartTotal();
 if(!pay[m].on){const others=paid();pay[m].on=true;pay[m].amount=sel().length===1?t:Math.max(0,t-others)}
 else{pay[m].on=false;pay[m].amount=0;if(m==='BANKAK')bankakId='';const s=sel();if(s.length===1)pay[s[0]].amount=t}
 document.querySelectorAll('.meth button').forEach(x=>x.setAttribute('aria-pressed',String(pay[x.dataset.m].on)));
 buildPayRows();
});
function resetInvoice(){cart.clear();METHODS.forEach(m=>{pay[m].on=false;pay[m].amount=0});bankakId='';$('q').value='';renderResults();document.querySelectorAll('.meth button').forEach(x=>x.setAttribute('aria-pressed','false'));renderCart()}
$('pay').onclick=()=>{
 if(saving)return;
 const msg=t=>{$('payMsg').textContent=t},total=cartTotal();
 if(!cart.size){msg('Add at least one product first.');return}
 const used=sel().filter(m=>pay[m].amount>0);
 if(!used.length){msg('Choose a payment method and enter the amount.');return}
 if(sel().some(m=>!(pay[m].amount>0))){msg('Enter an amount for every selected method, or unselect it.');return}
 const diff=total-paid();
 if(diff>1e-6){msg('Remaining '+money(diff)+' must be paid before saving.');return}
 if(diff<-1e-6){msg('The amounts are more than the total by '+money(-diff)+'.');return}
 let bid='';
 if(pay.BANKAK.on){bid=bankakId.trim();
  if(bid!==''&&!/^\d{4}$/.test(bid)){msg('Bankak ID must be exactly 4 digits, or leave it empty.');return}
  if(bid!==''&&sales.some(s=>String(s.bankakTransactionId||'')===bid)){msg('This Bankak ID is already used. Enter a unique one.');return}}
 const now=new Date(),invoice='INV-'+String(invoiceNo).padStart(4,'0');
 const record={invoice,date:now.toLocaleDateString('en-CA'),time:now.toLocaleTimeString('en-GB'),total,paymentMethod:used.length===1?used[0]:'SPLIT',payments:used.map(m=>({method:m,amount:pay[m].amount})),bankakTransactionId:bid,cashier:currentUser?currentUser.username:'',items:[...cart.values()].map(l=>({id:l.p.id,name:l.p.name,price:Number(l.p.price)||0,qty:l.q,lineTotal:(Number(l.p.price)||0)*l.q}))};
 saving=true;
 const fail=()=>{if(!saving)return;saving=false;msg('The invoice could not be saved. Try again.')};
 try{const tx=DB.transaction(['sales','meta'],'readwrite');tx.objectStore('sales').put(record);tx.objectStore('meta').put({key:'invoiceNo',value:invoiceNo+1});
  tx.oncomplete=()=>{saving=false;sales.push(record);invoiceNo++;resetInvoice();notice('SALE SAVED','Invoice '+invoice+' has been saved.')};
  tx.onerror=fail;tx.onabort=fail}catch(e){fail()}
};
// ---- Menu and settings ----
function closeAll(){$('menuPanel').classList.remove('open');$('setPanel').hidden=true;$('backdrop').hidden=true}
$('menuBtn').onclick=()=>{closeAll();$('menuPanel').classList.add('open');$('backdrop').hidden=false};
$('setBtn').onclick=()=>{const was=!$('setPanel').hidden;closeAll();if(!was){$('setPanel').hidden=false;$('backdrop').hidden=false}};
$('backdrop').onclick=closeAll;$('miSale').onclick=closeAll;
// ---- Accounts and login ----
const hex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
async function hashPw(pw,saltHex){
 const salt=Uint8Array.from(saltHex.match(/../g).map(h=>parseInt(h,16)));
 const key=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
 return hex(await crypto.subtle.deriveBits({name:'PBKDF2',salt,iterations:100000,hash:'SHA-256'},key,256));
}
const lgMsg=t=>{$('lgMsg').textContent=t};
const normCode=c=>String(c||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
function newCode(){const A='23456789ABCDEFGHJKMNPQRSTUVWXYZ',r=crypto.getRandomValues(new Uint8Array(12));let s='';r.forEach((v,i)=>{s+=A[v%A.length];if(i%4===3&&i<11)s+='-'});return s}
async function setRecovery(u){const code=newCode();u.recSalt=hex(crypto.getRandomValues(new Uint8Array(16)));u.recHash=await hashPw(normCode(code),u.recSalt);return code}
const saveUser=u=>new Promise((res,rej)=>{const tx=DB.transaction('users','readwrite');tx.objectStore('users').put(u);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)});
function showCode(code,title){$('codeTitle').textContent=title||'RECOVERY CODE';$('codeText').textContent=code;$('codeCopy').textContent='Copy';$('codeDialog').showModal()}
$('codeOk').onclick=()=>{$('codeDialog').close();$('codeText').textContent=''};
$('codeCopy').onclick=async()=>{try{await navigator.clipboard.writeText($('codeText').textContent);$('codeCopy').textContent='Copied'}catch(e){$('codeCopy').textContent='Select and copy'}};
function wireEye(b,i){b.onclick=()=>{const s=i.type==='password';i.type=s?'text':'password';b.textContent=s?'🙈':'👁';b.setAttribute('aria-label',s?'Hide password':'Show password')}}
wireEye($('lgEye'),$('lgPass'));wireEye($('rsEye'),$('rsPass'));
function showLogin(){closeAll();$('lgUser').value='';$('lgPass').value='';$('lgPass').type='password';$('lgEye').textContent='👁';lgMsg(users.length?'':'First time here: the username and password you enter will create the owner account.');$('lgBtn').textContent=users.length?'Sign in':'Create owner account';document.body.classList.add('auth')}
function enterApp(u){currentUser=u;try{sessionStorage.setItem('ab_user',u.username)}catch(e){}$('who').textContent=u.name;closeAll();document.body.classList.remove('auth')}
$('lgBtn').onclick=async()=>{
 if(!authReady){lgMsg('Loading… try again in a moment.');return}
 const un=$('lgUser').value.trim().toLowerCase(),pw=$('lgPass').value;
 if(!un||!pw){lgMsg('Enter your username and password.');return}
 if(!window.crypto||!crypto.subtle){lgMsg('Secure mode is not available. Open the app from its https address.');return}
 $('lgBtn').disabled=true;
 try{
  if(!users.length){
   if(un.length<3||!/^[a-z0-9._-]+$/.test(un)){lgMsg('Username: at least 3 letters or numbers, no spaces.');return}
   if(pw.length<4){lgMsg('Password must be at least 4 characters.');return}
   const salt=hex(crypto.getRandomValues(new Uint8Array(16)));
   const u={username:un,name:$('lgUser').value.trim(),salt,hash:await hashPw(pw,salt),role:'owner',created:new Date().toISOString()};
   const rcode=await setRecovery(u);
   await new Promise((res,rej)=>{const tx=DB.transaction('users','readwrite');tx.objectStore('users').put(u);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)});
   users.push(u);enterApp(u);showCode(rcode,'SAVE YOUR RECOVERY CODE');
  }else{
   const u=users.find(x=>x.username===un);
   if(!u||await hashPw(pw,u.salt)!==u.hash){lgMsg('Wrong username or password.');return}
   enterApp(u);
  }
 }catch(e){lgMsg('Something went wrong. Try again.')}
 finally{$('lgBtn').disabled=false}
};
$('lgPass').addEventListener('keydown',e=>{if(e.key==='Enter')$('lgBtn').click()});
$('lgForgot').onclick=()=>{
 if(!users.length){notice('FORGOT PASSWORD','No account exists yet. Type a username and a password, then tap Create owner account.');return}
 $('rsUser').value=$('lgUser').value;$('rsCode').value='';$('rsPass').value='';$('rsPass').type='password';$('rsEye').textContent='👁';$('rsMsg').textContent='';$('resetDialog').showModal()};
$('rsCancel').onclick=()=>$('resetDialog').close();
$('rsOk').onclick=async()=>{
 const m=x=>{$('rsMsg').textContent=x},un=$('rsUser').value.trim().toLowerCase(),code=normCode($('rsCode').value),pw=$('rsPass').value;
 if(!un||!code||!pw){m('Fill in the username, recovery code and new password.');return}
 if(pw.length<4){m('New password must be at least 4 characters.');return}
 if(!window.crypto||!crypto.subtle){m('Secure mode is not available. Open the app from its https address.');return}
 $('rsOk').disabled=true;
 try{
  const u=users.find(x=>x.username===un);
  if(u&&!u.recHash){m('No recovery code was created for this account.');return}
  if(!u||await hashPw(code,u.recSalt)!==u.recHash){m('Username or recovery code is not correct.');return}
  u.salt=hex(crypto.getRandomValues(new Uint8Array(16)));u.hash=await hashPw(pw,u.salt);
  const nc=await setRecovery(u);await saveUser(u);
  $('resetDialog').close();lgMsg('Password changed. Sign in with your new password.');showCode(nc,'NEW RECOVERY CODE');
 }catch(e){m('Something went wrong. Try again.')}
 finally{$('rsOk').disabled=false}
};
$('recBtn').onclick=async()=>{
 if(!currentUser)return;
 if(!confirm('Create a new recovery code? The old one will stop working.'))return;
 try{const u=currentUser,c=await setRecovery(u);await saveUser(u);closeAll();showCode(c,'NEW RECOVERY CODE')}catch(e){closeAll();notice('ERROR','Could not create a recovery code. Try again.')}
};
$('signOut').onclick=()=>{if(cart.size&&!confirm('Sign out and clear the current invoice?'))return;currentUser=null;try{sessionStorage.removeItem('ab_user')}catch(e){}resetInvoice();showLogin()};
// ---- Start ----
renderCart();
(async()=>{
 try{
  const db=await openDB();DB=db;await seedIfNeeded(db);
  products=(await req(db.transaction('products').objectStore('products').getAll())).map(p=>({...p,_n:norm(p.name)}));
  sales=await req(db.transaction('sales').objectStore('sales').getAll());
  const inv=await req(db.transaction('meta').objectStore('meta').get('invoiceNo'));
  invoiceNo=Math.max(inv?inv.value:1,...sales.map(s=>(parseInt(String(s.invoice).replace(/\D/g,''),10)||0)+1),1);
  users=await req(db.transaction('users').objectStore('users').getAll());authReady=true;
  let su=null;try{su=sessionStorage.getItem('ab_user')}catch(e){}
  const cu=users.find(x=>x.username===su);if(cu)enterApp(cu);else showLogin();
 }catch(e){lgMsg('Database error. Close the app and open it again.')}
 if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
